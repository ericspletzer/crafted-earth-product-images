<!DOCTYPE html>
<!--
  Crafted Earth — Selection page (anonymous, GitHub-Pages-hosted)
  Sister page to embed/index.html (gallery-card).

  Two data-source modes (resolved at load):
    1. ?d=<JSON>          — inline payload, primary+alts shape (canvas-app path)
    2. ?p=<slug>&id=<n>   — fetch ./data/<slug>.json, find item by id, render
                            as single primary (list-page-fed path; no alts)

  When ?p=&id= mode is used, a back-link to selections_list.html?p=<slug>
  renders above the page header.

  Approve buttons compose mailto:selections@craftedearth.com.

  No backend, no auth, no cost.
  Repo: ericspletzer/crafted-earth-product-images
  Path: /embed/selection.html
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crafted Earth — Selection</title>
  <style>
    /* Self-hosted EB Garamond — CE print/equation brand serif, no third-party dependency */
    @font-face {
      font-family: 'EB Garamond';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('eb-garamond.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Type scale ──────────────────────────────────────────────────────────
       Modular scale, major-third ratio (1.25), anchored on a 15px body — shared
       verbatim with selections_list.html so the two pages read as one document.
         step −2  9.6px   micro caps (badges)
         step −1  12px    captions, meta, attrs labels
         base     15px    body / notes reading text
         step +1  18.75px  card title (display sans)
         hero     32px    item title (Garamond) — set optically, off-ladder */
    :root {
      --f-serif: 'EB Garamond', Georgia, 'Times New Roman', serif;
      --f-sans: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --f-mono: 'Consolas', 'Monaco', monospace;

      --t-micro: 9.6px;   /* step −2 */
      --t-cap:   12px;    /* step −1 */
      --t-base:  15px;    /* base    */
      --t-up1:   18.75px; /* step +1 */
      --t-hero:  32px;    /* item title */

      --lh-tight: 1.08;   /* display leading */
      --lh-read:  1.55;   /* reading leading (notes) */
      --measure:  66ch;   /* optimal reading measure (Bringhurst 45–75) */
    }

    html, body {
      font-family: var(--f-sans);
      background: #f4f3ef;
      color: #1a1a1a;
      font-size: var(--t-base);
      line-height: 1.5;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }

    /* ── Top band ──────────────────────────────────────────────────────────── */
    header.top {
      border-bottom: 1px solid #c4c0b5;   /* warm hairline — structure without heavy ink */
      padding-bottom: 16px;
      margin-bottom: 22px;
    }

    /* Masthead row: context column left, CE stamp right.
       flex-start so the heavier stamp top-aligns to the eyebrow cap-line. */
    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 16px;
    }

    /* Left column: eyebrow + back-link stacked */
    .masthead-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    /* Context label ("Selection") */
    .brand {
      font-size: var(--t-micro);
      font-weight: 600;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #9a9a9a;
      line-height: 1;
    }

    /* Back-link to project list */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: var(--t-cap);
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #6b6b6b;
      text-decoration: none;
      transition: color 0.15s;
      line-height: 1;
    }
    .back-link::before {
      content: "\2190";           /* ← arrow */
      font-size: 13px;
      opacity: 0.7;
    }
    .back-link:hover { color: #0a304e; }

    /* Right: heritage stamp — dark ink, larger, real opacity. Optical
       counterweight to the Garamond title (Tschichold dynamic equilibrium). */
    .ce-logo {
      flex-shrink: 0;
      display: block;
      line-height: 0;
      margin-top: -2px;
    }
    .ce-logo img {
      display: block;
      width: 72px;
      height: auto;
      opacity: 0.62;
    }

    /* Title row: type-mark chip + item name */
    .title-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 0;
    }

    /* Item title — the hero. EB Garamond ties the viewer to the print/equation
       brand. Negative tracking tightens the large serif optically. */
    h1 {
      font-family: var(--f-serif);
      font-size: var(--t-hero);
      font-weight: 500;
      letter-spacing: -0.003em;
      color: #1a1a1a;
      line-height: var(--lh-tight);
      margin: 0;
      font-feature-settings: "liga" 1, "kern" 1;
    }

    /* Meta line */
    .meta {
      margin-top: 10px;
      font-size: var(--t-cap);
      color: #9a9a9a;
      letter-spacing: 0.02em;
    }
    .meta span + span::before { content: " \00b7 "; color: #cfcabd; }

    /* Type-mark chip in header (matches selections_list.html .tm style).
       Tabular figures so the mono chip aligns on its numerals. */
    .tm-chip {
      font-family: var(--f-mono);
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: #0a304e;
      letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
      padding: 4px 10px;
      border-radius: 3px;
      white-space: nowrap;
    }

    /* Header-level secondary action (Return with comments) */
    .top-actions {
      margin-top: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-ghost {
      display: inline-block;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: #0a304e;
      background: transparent;
      border: 1px solid #0a304e;
      padding: 8px 14px;
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    .btn-ghost:hover { background: #0a304e; color: #fff; }
    .top-actions-hint {
      font-size: 12px;
      color: #6b6b6b;
    }

    /* Section labels — micro caps, wide tracking; the tracking is the formality.
       Generous top margin establishes the vertical rhythm between sections. */
    .section-label {
      font-size: var(--t-micro);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #6b6b6b;
      margin: 34px 0 14px;
      border-bottom: 1px solid #d4d4d4;
      padding-bottom: 8px;
    }

    /* Cards */
    .card {
      background: #fff;
      border: 1px solid #d4d4d4;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 20px;
    }
    .card.primary { border-color: #0a304e; border-width: 2px; }

    .card-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #fafaf8;
      border: 1px solid #e8e8e6;
      border-radius: 2px;
    }
    .card-image.no-image {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #bbb;
    }

    .card-body { display: flex; flex-direction: column; gap: 8px; }
    /* Card title — one step up (18.75px), 600 weight; leads on size alone. */
    .card-title {
      font-size: var(--t-up1);
      font-weight: 600;
      margin: 0;
      color: #1a1a1a;
      line-height: 1.12;
      letter-spacing: -0.003em;
    }
    .card-mfr { font-size: var(--t-cap); color: #6b6b6b; letter-spacing: 0.01em; }
    .card-attrs {
      display: flex; flex-wrap: wrap;
      gap: 6px 18px;            /* tight rows, generous column gutter */
      font-size: var(--t-cap);
      color: #4a4a4a;
      margin: 4px 0;
    }
    /* Labels recede to uppercase micro-caps; the value carries the line
       (Lupton — smallest effective difference; one signal does the work). */
    .card-attrs strong {
      color: #8a8578;
      font-weight: 600;
      font-size: var(--t-micro);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .card-attrs span { font-variant-numeric: tabular-nums lining-nums; }

    .badge {
      display: inline-block;
      font-size: var(--t-micro);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 2px;
      background: #0a304e;
      color: #fff;
      margin-right: 6px;
    }
    .badge.alt { background: #6b6b6b; }

    /* Product notes — the one true reading passage on the page. Constrain to a
       measure (Bringhurst: 45–75 chars) and open the leading so it reads like a
       spec paragraph, not a caption. base size, reading leading. */
    .card-notes {
      font-size: var(--t-base);
      color: #3c3c3c;
      line-height: var(--lh-read);
      max-width: var(--measure);
      margin: 4px 0 10px;
    }

    .card-actions {
      margin-top: auto;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      border: 1px solid #0a304e;
      background: #0a304e;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 10px 18px;
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn:hover { background: #06243d; }
    .link-out {
      font-size: 12px;
      color: #6b6b6b;
      text-decoration: none;
      border-bottom: 1px solid #d4d4d4;
    }
    .link-out:hover { color: #1a1a1a; border-color: #1a1a1a; }

    /* Product link — Tier 2 (under mfr·model line) */
    .product-link {
      display: inline-block;
      font-size: 13px;
      color: #0a304e;
      text-decoration: none;
      border-bottom: 1px solid rgba(10, 48, 78, 0.3);
      transition: border-color 0.15s;
    }
    .product-link:hover { border-bottom-color: #0a304e; }

    /* Component rows */
    .comp-row {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 12px;
      align-items: center;
      background: #fafaf8;
      border: 1px solid #e8e8e6;
      border-radius: 3px;
      padding: 10px 12px;
      margin-bottom: 6px;
    }
    .comp-thumb {
      width: 64px;
      height: 64px;
      object-fit: contain;
      background: #fafaf8;
      border: 1px solid #e8e8e6;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .comp-thumb.no-image {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #bbb;
    }
    .comp-name { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .comp-name .comp-title {
      font-size: var(--t-base);
      font-weight: 600;
      color: #1a1a1a;
      line-height: 1.2;
    }
    .comp-name .comp-mfr {
      font-size: var(--t-cap);
      color: #6b6b6b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .comp-name .comp-detail {
      font-size: var(--t-cap);
      color: #4a4a4a;
    }
    .comp-qty {
      font-size: var(--t-cap);
      color: #6b6b6b;
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Footer */
    footer.bot {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid #d4d4d4;
      font-size: 10.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6b6b6b;
      text-align: center;
    }

    /* Mobile — hero steps down; logo steps down with it to keep the optical
       balance at small size (Tschichold). Notes measure already caps below
       the single-column width, so it reflows cleanly. */
    @media (max-width: 600px) {
      :root { --t-hero: 26px; }
      .card { grid-template-columns: 1fr; }
      .card-image { max-width: 240px; margin: 0 auto; }
      .ce-logo img { width: 54px; }
    }

    /* Empty-state */
    .empty {
      padding: 60px 20px;
      text-align: center;
      color: #6b6b6b;
    }
    .empty h2 { font-size: 18px; margin-bottom: 8px; color: #1a1a1a; }
    .empty p { font-size: 14px; }

    /* Iframe-context banner (only shown when embedded) */
    .iframe-banner {
      background: #fff8d6;
      border: 1px solid #d4c068;
      border-radius: 4px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #1a1a1a;
      display: none;
    }
    .iframe-banner.show { display: block; }
    .iframe-banner a {
      color: #0a304e;
      font-weight: 600;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="wrap" id="root">
    <div class="empty">
      <h2>Loading selection&hellip;</h2>
      <p>If you see this for more than a moment, the link may be incomplete. Contact eric@craftedearth.com.</p>
    </div>
  </div>

  <script>
    (function () {
      // ---- Demo fallback (used when no ?d= param is given) ------------------
      const DEMO = {
        tm: "SS08",
        ti: "TOILET PAPER HOLDER",
        pn: "33 Estelle Ave",
        ar: "En Suite Bathroom",
        qt: 2, un: "EA", ld: 10,
        items: [
          {
            id: 163, kind: "primary",
            img: "https://raw.githubusercontent.com/ericspletzer/crafted-earth-product-images/main/649-20260512160808.png",
            make: "Kohler", mod: "K-27064", ti: "Occasion Vertical Toilet Paper Holder",
            no: "The Occasion Vertical Toilet Paper Holder adds glamour and function to your bathroom with vintage Hollywood-inspired design. Available in multiple finishes and makes an elegant accent piece for any bathroom space.",
            fi: "Matte Black", co: "Occasion",
            url: "https://www.kohler.com/en/products/bathroom-accessories/shop-bathroom-accessories/occasion-vertical-toilet-paper-holder-27064?skuId=27064-BL"
          },
          {
            id: 283, kind: "alt",
            img: "https://raw.githubusercontent.com/ericspletzer/crafted-earth-product-images/main/650-20260512160908.jpg",
            make: "Kohler", mod: "K-27065-BL", ti: "Occasion Pivoting Toilet Paper Holder",
            no: "The Occasion Pivoting toilet paper holder adds glamour and function with vintage Hollywood-inspired accents. Available in multiple finishes including Matte Black, Polished Chrome, and various brushed metal options.",
            fi: "Matte Black", co: "Occasion",
            url: "https://www.kohler.com/en/products/bathroom-accessories/shop-bathroom-accessories/occasion-pivoting-toilet-paper-holder-27065?skuId=27065-BL"
          },
          {
            id: 284, kind: "alt",
            img: "https://raw.githubusercontent.com/ericspletzer/crafted-earth-product-images/main/651-20260512161040.jpg",
            make: "Kohler", mod: "K-27128-BL", ti: "Toilet Paper Holder With Tray",
            no: "The Occasion toilet paper holder with tray combines vintage Hollywood-inspired glamour with practical function. Features a matte black finish with brushed moderne brass accents, adding an elegant accent to any bathroom.",
            fi: "Matte Black", co: "Occasion",
            url: "https://www.kohler.com/en/products/bathroom-accessories/shop-bathroom-accessories/occasion-toilet-paper-holder-with-tray-27128?skuId=27128-BL"
          }
        ]
      };

      // ---- Resolve data source --------------------------------------------
      // Three modes, in priority order:
      //   ?d=<JSON>             — inline payload (full primary+alts shape; canvas-app path)
      //   ?p=<slug>&id=<n>      — fetch ./data/<slug>.json, locate row by id, render
      //                            as single primary (no alts; list-page-fed path)
      //   no param              — DEMO fallback
      const params = new URLSearchParams(location.search);
      const rawInline = params.get('d');
      const projectSlug = params.get('p');
      const itemId = params.get('id');

      let data;

      if (rawInline) {
        try {
          data = JSON.parse(rawInline);
        } catch (e) {
          renderEmpty('Could not read selection data. The link may be corrupted.');
          return;
        }
        if (!data.items || data.items.length === 0) {
          renderEmpty('Selection contains no items.');
          return;
        }
        render(data);
      } else if (projectSlug && itemId) {
        const safeSlug = String(projectSlug).replace(/[^a-z0-9\-_]/gi, '');
        const safeId = String(itemId).replace(/[^0-9]/g, '');
        fetch('./data/' + safeSlug + '.json', { cache: 'no-cache' })
          .then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
          .then(json => {
            const allItems = json.items || [];
            const row = allItems.find(it => String(it.id) === safeId && (!it.pt || it.pt === 'Primary'));
            if (!row) {
              renderEmpty('Selection ' + safeId + ' not found in project "' + safeSlug + '".');
              return;
            }
            // Collect alternates pointing to this primary (pp === id).
            const altRows = allItems.filter(it => it.pt === 'Alternative' && String(it.pp) === safeId);
            // Collect components pointing to this primary (pp === id).
            const compRows = allItems.filter(it => it.pt === 'Component' && String(it.pp) === safeId);
            // Transform flat list-row(s) into selection.html's primary+alts shape.
            // url field in the manifest is the deep-link — NOT the product URL.
            // pu field is the product URL; map to item.url for cardHtml to render.
            const toItem = (r, kind) => ({
              kind: kind,
              id: r.id,
              img: r.img,
              make: r.make,
              mod: r.mod,
              ti: r.ti,
              fi: r.fi,
              co: r.co,
              msrp: r.msrp,
              url: r.pu,       // product URL (pu), NOT the deep-link (r.url)
              no: r.no,
              ld: r.ld,
              qt: r.qt,
              un: r.un
            });
            data = {
              tm: row.tm,
              st: row.st,
              ti: row.ti,
              pn: json.pn,
              ar: row.ar,
              qt: row.qt,
              un: row.un,
              ld: row.ld,
              slug: safeSlug,
              parentTitle: json.title,
              items: [toItem(row, 'primary')].concat(altRows.map(a => toItem(a, 'alt'))),
              components: compRows.map(c => toItem(c, 'component'))
            };
            render(data);
          })
          .catch(err => {
            renderEmpty('Could not load selection (' + err.message + ').');
          });
      } else {
        data = DEMO;
        render(data);
      }

      // ---- Renderers --------------------------------------------------------
      function renderEmpty(msg) {
        document.getElementById('root').innerHTML =
          '<div class="empty"><h2>Selection unavailable</h2><p>' + escapeHtml(msg) + '</p></div>';
      }

      function render(d) {
        const root = document.getElementById('root');
        const primary = d.items.find(i => i.kind === 'primary') || d.items[0];
        const alts = d.items.filter(i => i !== primary);

        const meta = [d.pn, d.ar, fmtQty(d.qt, d.un), fmtLead(d.ld)]
          .filter(Boolean)
          .map(s => '<span>' + escapeHtml(s) + '</span>')
          .join('');

        // Detect iframe context — banner only shown when embedded.
        // Wrapped in try/catch because cross-origin iframes throw when accessing window.top.
        let inIframe = false;
        try { inIframe = window.top !== window.self; }
        catch (e) { inIframe = true; }

        const directUrl = escapeAttr(window.location.href);

        let html = '';
        if (inIframe) {
          html += '<div class="iframe-banner show">';
          html += '  This selection is embedded. To use the Approve and Return buttons, ';
          html += '  <a href="' + directUrl + '" target="_blank" rel="noopener">open this page in a new tab</a>.';
          html += '</div>';
        }

        html += '<header class="top">';
        html += '  <div class="masthead">';
        html += '    <div class="masthead-left">';
        html += '      <div class="brand">Selection</div>';
        // Back-link to project list (only when reached via ?p=&id= path)
        if (d.slug) {
          const backLabel = d.pn ? 'All ' + d.pn + ' selections' : 'All selections';
          html += '      <a class="back-link" href="selections_list.html?p=' + escapeAttr(d.slug) + '">' + escapeHtml(backLabel) + '</a>';
        }
        html += '    </div>';
        html += '    <a class="ce-logo" href="https://craftedearth.com" target="_blank" rel="noopener" aria-label="Crafted Earth">';
        html += '      <img src="ce-logo-dark.png" alt="Crafted Earth" width="72" height="72">';
        html += '    </a>';
        html += '  </div>';
        html += '  <div class="title-row">';
        if (d.tm) html += '    <span class="tm-chip">' + escapeHtml(d.tm) + '</span>';
        html += '    <h1>' + escapeHtml(d.ti || '') + '</h1>';
        html += '  </div>';
        if (meta) html += '  <div class="meta">' + meta + '</div>';
        html += '  <div class="top-actions">';
        html += '    <a class="btn-ghost" href="' + buildReturnMailto(d) + '" target="_blank" rel="noopener">Return with comments</a>';
        html += '    <span class="top-actions-hint">Questions, change requests, or anything that&rsquo;s not a simple approve.</span>';
        html += '  </div>';
        html += '</header>';

        html += '<div class="section-label">Primary Selection</div>';
        html += cardHtml(primary, true, d);

        if (alts.length > 0) {
          html += '<div class="section-label">Alternatives &mdash; ' + alts.length + '</div>';
          alts.forEach(a => { html += cardHtml(a, false, d); });
        }

        const comps = d.components || [];
        if (comps.length > 0) {
          html += '<div class="section-label">Components &mdash; ' + comps.length + '</div>';
          // <!-- Optional future note: "These items are part of the assembly above — no separate approval needed." -->
          comps.forEach(c => { html += compRowHtml(c); });
        }

        html += '<footer class="bot">';
        html += '  <div>Crafted Earth, Inc. &middot; San Rafael, CA &middot; CA lic. B1015145 &middot; C82156</div>';
        html += '  <div style="margin-top:6px;">Approvals are sent by email and recorded with timestamp.</div>';
        html += '</footer>';

        root.innerHTML = html;
      }

      function cardHtml(item, isPrimary, d) {
        const cls = 'card' + (isPrimary ? ' primary' : '');
        const badge = isPrimary
          ? '<span class="badge">Primary</span>'
          : '<span class="badge alt">Alternative</span>';

        // Graceful empty-product state: no make/mod/img — render TypeMark+title only
        const hasProduct = item.make || item.mod || item.img;

        const mfrModel = [item.make, item.mod ? 'Model ' + item.mod : null].filter(Boolean).join(' · ');

        // Product link — Tier 2 (under mfr·model line). Split on <br> and take first.
        let productUrl = item.url || '';
        if (productUrl) {
          productUrl = productUrl.split(/<br\s*\/?>/i)[0].trim();
        }
        const productLinkHtml = productUrl
          ? '<a class="product-link" href="' + escapeAttr(productUrl) + '" target="_blank" rel="noopener noreferrer">View on manufacturer site &#8599;</a>'
          : '';

        // Expanded attrs — omit any null/undefined/''/falsy field. msrp===0 is valid.
        const attrs = [];
        if (item.fi) attrs.push('<span><strong>Finish:</strong> ' + escapeHtml(item.fi) + '</span>');
        if (item.co) attrs.push('<span><strong>Collection:</strong> ' + escapeHtml(item.co) + '</span>');
        if (item.qt) attrs.push('<span><strong>Qty:</strong> ' + escapeHtml(String(item.qt)) + (item.un ? ' ' + escapeHtml(item.un) : '') + '</span>');
        if (item.ld) attrs.push('<span><strong>Lead time:</strong> ' + escapeHtml(String(item.ld)) + ' days</span>');
        if (item.msrp || item.msrp === 0) attrs.push('<span><strong>List price:</strong> $' + escapeHtml(formatMoney(item.msrp)) + '</span>');

        const imgHtml = item.img
          ? '<img class="card-image" src="' + escapeAttr(item.img) + '" alt="' + escapeAttr(item.ti || '') + '" onerror="this.classList.add(\'no-image\');this.removeAttribute(\'src\');" />'
          : '<div class="card-image no-image">No image</div>';

        return [
          '<div class="' + cls + '">',
            imgHtml,
            '<div class="card-body">',
              '<div>' + badge + '</div>',
              '<p class="card-title">' + escapeHtml(item.ti || '') + '</p>',
              hasProduct && mfrModel ? '<div class="card-mfr">' + escapeHtml(mfrModel) + '</div>' : '',
              productLinkHtml,
              attrs.length ? '<div class="card-attrs">' + attrs.join('') + '</div>' : '',
              item.no ? '<p class="card-notes">' + escapeHtml(item.no) + '</p>' : '',
              // Approve only when this selection slot is still Proposed (an action is pending).
              // Decided items (Selected/Ordered/Installed/...) show no Approve button.
              (!d.st || d.st === 'Proposed')
                ? '<div class="card-actions"><a class="btn" href="' + buildMailto(item, d) + '" target="_blank" rel="noopener">Approve this Design Selection</a></div>'
                : '',
            '</div>',
          '</div>'
        ].join('');
      }

      function compRowHtml(item) {
        const thumbHtml = item.img
          ? '<img class="comp-thumb" src="' + escapeAttr(item.img) + '" alt="' + escapeAttr(item.ti || '') + '" onerror="this.classList.add(\'no-image\');this.removeAttribute(\'src\');" />'
          : '<div class="comp-thumb no-image">No image</div>';

        const mfrMod = [item.make, item.mod].filter(Boolean).join(' · ');
        const finColl = [item.fi, item.co].filter(Boolean).join(' · ');

        // Qty: suppress if falsy (qty=0 also suppressed per spec)
        const qtyHtml = item.qt ? '<div class="comp-qty">' + escapeHtml(String(item.qt)) + (item.un ? ' ' + escapeHtml(item.un) : '') + '</div>' : '';

        return [
          '<div class="comp-row">',
            thumbHtml,
            '<div class="comp-name">',
              '<div class="comp-title">' + escapeHtml(item.ti || '') + '</div>',
              mfrMod ? '<div class="comp-mfr">' + escapeHtml(mfrMod) + '</div>' : '',
              finColl ? '<div class="comp-detail">' + escapeHtml(finColl) + '</div>' : '',
            '</div>',
            qtyHtml,
          '</div>'
        ].join('');
      }

      function buildMailto(item, d) {
        const make  = item.make || '';
        const mod   = item.mod || '';
        const optLabel = [make, mod].filter(Boolean).join(' ') || (item.ti || 'option');
        const subject = 'Selection approval: ' + (d.tm || '') + (d.tm ? ' ' : '') + optLabel;
        const viewUrl = window.location.href; // canonical link back to this selection

        const lines = [
          'Hello Selections Team,',
          '',
          'I approve this option:',
          ''
        ];
        if (d.tm)   lines.push('  Type Mark:    ' + d.tm);
        if (d.ti)   lines.push('  Item:         ' + d.ti);
        if (make)   lines.push('  Manufacturer: ' + make);
        if (mod)    lines.push('  Model:        ' + mod);
        if (item.fi) lines.push('  Finish:       ' + item.fi);
        if (item.co) lines.push('  Collection:   ' + item.co);
        if (item.msrp || item.msrp === 0) lines.push('  List price:   $' + formatMoney(item.msrp));
        if (item.id) lines.push('  Purchase ID:  ' + item.id);
        if (d.pn)   lines.push('  Project:      ' + d.pn);
        if (d.ar)   lines.push('  Area:         ' + d.ar);
        if (item.url) {
          lines.push('');
          lines.push('  Product spec:');
          lines.push('  ' + item.url);
        }
        lines.push('');
        lines.push('  View this selection:');
        lines.push('  ' + viewUrl);
        lines.push('');
        lines.push('Thanks');

        const body = lines.join('\r\n');
        return 'mailto:selections@craftedearth.com'
          + '?subject=' + encodeURIComponent(subject)
          + '&body=' + encodeURIComponent(body);
      }

      function buildReturnMailto(d) {
        const subject = 'Selection feedback: ' + (d.tm || '') + (d.tm ? ' ' : '') + (d.ti || '');
        const viewUrl = window.location.href;
        // Find the primary among the items for context (return emails go before approval).
        const primary = (d.items || []).find(i => i.kind === 'primary') || (d.items || [])[0] || {};

        const lines = [
          'Hello Selections Team,',
          '',
          'A few thoughts on this selection:',
          '',
          '  [ Write your comments, questions, or change requests here ]',
          '',
          '---'
        ];
        if (d.tm)   lines.push('  Type Mark:    ' + d.tm);
        if (d.ti)   lines.push('  Item:         ' + d.ti);
        if (primary.make) lines.push('  Manufacturer: ' + primary.make);
        if (primary.mod)  lines.push('  Model:        ' + primary.mod);
        if (primary.fi)   lines.push('  Finish:       ' + primary.fi);
        if (primary.co)   lines.push('  Collection:   ' + primary.co);
        if (primary.msrp || primary.msrp === 0) lines.push('  List price:   $' + formatMoney(primary.msrp));
        if (primary.id) lines.push('  Purchase ID:  ' + primary.id);
        if (d.pn)   lines.push('  Project:      ' + d.pn);
        if (d.ar)   lines.push('  Area:         ' + d.ar);
        lines.push('');
        lines.push('  View this selection:');
        lines.push('  ' + viewUrl);
        lines.push('');
        lines.push('Thanks');

        const body = lines.join('\r\n');
        return 'mailto:selections@craftedearth.com'
          + '?subject=' + encodeURIComponent(subject)
          + '&body=' + encodeURIComponent(body);
      }

      // ---- Helpers ----------------------------------------------------------
      function formatMoney(n) {
        const num = Number(n);
        if (!isFinite(num)) return '';
        return num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      }
      function fmtQty(q, u) {
        if (!q && q !== 0) return '';
        return 'Qty ' + q + (u ? ' ' + u : '');
      }
      function fmtLead(d) {
        if (!d && d !== 0) return '';
        return 'Lead ' + d + ' days';
      }
      function escapeHtml(s) {
        if (s === null || s === undefined) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }
      function escapeAttr(s) {
        if (s === null || s === undefined) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }
    })();
  </script>
</body>
</html>
